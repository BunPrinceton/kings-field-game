<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="blueSilk" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#003366"/>
      <line x1="0" y1="0" x2="30" y2="30" stroke="#004080" stroke-width="0.5" opacity="0.5"/>
      <line x1="30" y1="0" x2="0" y2="30" stroke="#004080" stroke-width="0.5" opacity="0.5"/>
      <circle cx="15" cy="15" r="0.5" fill="#0055aa" opacity="0.7"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#blueSilk)"/>
  <!-- Add shimmer effect -->
  <path d="M50,50 Q150,100 250,50 T450,50" stroke="#0066cc" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M50,200 Q150,250 250,200 T450,200" stroke="#0066cc" stroke-width="2" fill="none" opacity="0.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="goldBrocade" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#8b7355"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#d4af37" stroke-width="1"/>
      <circle cx="20" cy="20" r="3" fill="#d4af37"/>
      <path d="M10,20 L30,20 M20,10 L20,30" stroke="#d4af37" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#goldBrocade)"/>
  <!-- Add luxury shimmer -->
  <circle cx="100" cy="100" r="20" fill="#d4af37" opacity="0.1"/>
  <circle cx="400" cy="400" r="25" fill="#d4af37" opacity="0.1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="greenLinen" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#2d5016"/>
      <line x1="0" y1="7.5" x2="15" y2="7.5" stroke="#3a6620" stroke-width="1" opacity="0.5"/>
      <line x1="7.5" y1="0" x2="7.5" y2="15" stroke="#3a6620" stroke-width="1" opacity="0.3"/>
      <rect x="3" y="3" width="2" height="2" fill="#234010" opacity="0.4"/>
      <rect x="10" y="10" width="2" height="2" fill="#234010" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#greenLinen)"/>
  <!-- Add weathering -->
  <ellipse cx="250" cy="450" rx="60" ry="30" fill="#1a3010" opacity="0.2"/>
  <ellipse cx="400" cy="80" rx="40" ry="50" fill="#1a3010" opacity="0.15"/>
</svg>

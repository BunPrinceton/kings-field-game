<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Shield background -->
  <path d="M256 32 L464 96 L464 256 Q464 384 256 480 Q48 384 48 256 L48 96 Z"
        fill="#1a1a2e" stroke="#d4af37" stroke-width="8"/>

  <!-- Crown -->
  <g transform="translate(256,240)">
    <!-- Crown base -->
    <ellipse cx="0" cy="40" rx="110" ry="20" fill="#d4af37"/>
    <rect x="-110" y="20" width="220" height="20" fill="#d4af37"/>

    <!-- Crown points -->
    <path d="M-90,-30 L-75,-80 L-60,-30 Z" fill="#d4af37"/>
    <path d="M-40,-40 L-25,-90 L-10,-40 Z" fill="#d4af37"/>
    <path d="M10,-40 L25,-90 L40,-40 Z" fill="#d4af37"/>
    <path d="M60,-30 L75,-80 L90,-30 Z" fill="#d4af37"/>

    <!-- Center crown point (tallest) -->
    <path d="M-15,-50 L0,-110 L15,-50 Z" fill="#d4af37"/>

    <!-- Jewels on crown points -->
    <circle cx="-75" cy="-80" r="8" fill="#c41e3a"/>
    <circle cx="-25" cy="-90" r="8" fill="#0066cc"/>
    <circle cx="0" cy="-110" r="10" fill="#c41e3a"/>
    <circle cx="25" cy="-90" r="8" fill="#0066cc"/>
    <circle cx="75" cy="-80" r="8" fill="#c41e3a"/>

    <!-- Crown band decoration -->
    <circle cx="-80" cy="10" r="6" fill="#c41e3a"/>
    <circle cx="-50" cy="10" r="6" fill="#0066cc"/>
    <circle cx="-20" cy="10" r="6" fill="#c41e3a"/>
    <circle cx="10" cy="10" r="6" fill="#0066cc"/>
    <circle cx="40" cy="10" r="6" fill="#c41e3a"/>
    <circle cx="70" cy="10" r="6" fill="#0066cc"/>

    <!-- Crown cross -->
    <path d="M-5,-110 L5,-110 L5,-130 L15,-130 L15,-140 L5,-140 L5,-160 L-5,-160 L-5,-140 L-15,-140 L-15,-130 L-5,-130 Z"
          fill="#d4af37" stroke="#c0c0c0" stroke-width="1"/>
    <circle cx="0" cy="-160" r="5" fill="#c41e3a"/>
  </g>
</svg>

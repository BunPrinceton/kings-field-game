<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Shield background -->
  <path d="M256 32 L464 96 L464 256 Q464 384 256 480 Q48 384 48 256 L48 96 Z"
        fill="#003366" stroke="#c0c0c0" stroke-width="8"/>

  <!-- Lion rampant -->
  <g transform="translate(256,280) scale(1.2)">
    <!-- Lion body -->
    <ellipse cx="-10" cy="0" rx="40" ry="50" fill="#d4af37"/>

    <!-- Lion head -->
    <circle cx="-20" cy="-40" r="35" fill="#d4af37"/>

    <!-- Mane -->
    <circle cx="-25" cy="-50" r="12" fill="#8b7355"/>
    <circle cx="-10" cy="-55" r="12" fill="#8b7355"/>
    <circle cx="-35" cy="-40" r="12" fill="#8b7355"/>
    <circle cx="-40" cy="-25" r="10" fill="#8b7355"/>

    <!-- Lion face -->
    <circle cx="-30" cy="-45" r="3" fill="#1a1a2e"/>
    <circle cx="-15" cy="-45" r="3" fill="#1a1a2e"/>
    <path d="M-25,-35 Q-22,-32 -20,-35" stroke="#1a1a2e" stroke-width="2" fill="none"/>

    <!-- Front legs raised -->
    <rect x="-30" y="-20" width="10" height="40" fill="#d4af37" transform="rotate(-30 -25 -20)"/>
    <rect x="-15" y="-25" width="10" height="45" fill="#d4af37" transform="rotate(-15 -10 -25)"/>

    <!-- Back legs -->
    <rect x="0" y="20" width="12" height="35" fill="#d4af37"/>
    <rect x="15" y="25" width="12" height="30" fill="#d4af37"/>

    <!-- Tail -->
    <path d="M20,10 Q40,-10 50,-30 L55,-25 Q45,-5 25,15 Z" fill="#d4af37"/>
    <circle cx="55" cy="-28" r="8" fill="#8b7355"/>

    <!-- Crown -->
    <path d="M-35,-65 L-30,-75 L-25,-65 L-20,-75 L-15,-65 L-10,-75 L-5,-65 L-5,-60 L-35,-60 Z"
          fill="#d4af37" stroke="#c0c0c0" stroke-width="1"/>
  </g>
</svg>
